[codelinks]
set_local_url = true
local_url_field = "local-url"
set_remote_url = true
remote_url_field = "remote-url"

[codelinks.projects.demo]

remote_url_pattern = "https://github.com/useblocks/sphinx-codelinks/blob/{commit}/{path}#L{line}"

[codelinks.projects.demo.source_discover]
comment_type = "cpp"
src_dir = "./src"
include = ["**/*.cpp"]
gitignore = false

[codelinks.projects.demo.analyse.oneline_comment_style]
start_sequence = "[["
end_sequence = "]]"
field_split_char = ","
needs_fields = [
  { "name" = "id" },
  { "name" = "title" },
  { "name" = "type", "default" = "impl" },
  { "name" = "links", "type" = "list[str]", "default" = [] },
]
